<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PR Layers</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header id="hdr">
    <div class="row"><strong>PR Layers</strong><span id="auth" class="muted"></span></div>
    <div id="prline" class="muted">Open a pull request on github.com.</div>
    <div class="row gap">
      <button id="refresh" disabled>Analyze</button>
      <span id="status" class="muted"></span>
    </div>
  </header>
  <section id="onboard" hidden>
    <h3>Set up a read-only token</h3>
    <p>PR Layers reads pull request files with a fine-grained GitHub token that only has <b>Pull requests: Read-only</b> and <b>Contents: Read-only</b>.</p>
    <button id="setup">Set up token</button>
  </section>
  <section id="warnings"></section>
  <main id="layers"></main>
  <script type="module" src="panel.js"></script>
</body>
</html>
